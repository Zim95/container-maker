# NetworkPolicies applied to every per-user namespace ({user_id}-namespace) at creation time by
# container-maker (NamespaceManager -> manifest_loader). Placeholders ${NAMESPACE}, ${POD_CIDR},
# ${SERVICE_CIDR} are substituted at apply time.
#
# Intent — the user's untrusted root shell MAY:
#   - be reached by socket-ssh on :22 (terminal),
#   - resolve DNS,
#   - reach the INTERNET (a dev terminal needs apt/git/pip),
# but MUST NOT reach ANY internal service (Postgres, Redis, MinIO), other tenants, or arbitrary
# in-cluster IPs. The pod needs NO database access: status is written by the central status_monitor
# (which reads pod phase from the k8s API), not by an in-pod sidecar — so there is no Postgres
# egress hole at all.
#
# ⚠️ NetworkPolicy is only ENFORCED by a policy-capable CNI (Calico/Cilium). docker-desktop's
# default CNI ACCEPTS these but does NOT enforce them — validate enforcement on the real cluster.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: ${NAMESPACE}
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: ${NAMESPACE}
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-socket-ssh
  namespace: ${NAMESPACE}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: browseterm
      ports:
        - protocol: TCP
          port: 22
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-internet-deny-internal
  namespace: ${NAMESPACE}
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    # Allow the internet, but carve out the cluster's own ranges so in-cluster targets
    # (other tenants, Redis, MinIO, arbitrary pods/services) are NOT reachable this way.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - ${POD_CIDR}
              - ${SERVICE_CIDR}
