# NetworkPolicies applied to every per-user namespace ({user_id}-namespace) at creation time by
# container-maker (NamespaceManager -> manifest_loader). Placeholders ${NAMESPACE}, ${POD_CIDR},
# ${SERVICE_CIDR} are substituted at apply time.
#
# Intent — the user's untrusted root shell (and the status-sidecar sharing its pod) MAY:
#   - be reached by socket-ssh on :22 (terminal),
#   - resolve DNS,
#   - reach Postgres :5432 (the sidecar writes status),
#   - reach the INTERNET (a dev terminal needs apt/git/pip),
# but MUST NOT reach other internal services (Redis, MinIO), other tenants, or arbitrary in-cluster
# IPs. The k8s API (the sidecar's pod-watch) is reachable via the internet rule — its real endpoint
# is a node/host IP outside the cluster CIDRs.
#
# ⚠️ NetworkPolicy is only ENFORCED by a policy-capable CNI (Calico/Cilium). docker-desktop's
# default CNI ACCEPTS these but does NOT enforce them — validate enforcement on the real cluster.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: ${NAMESPACE}
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: ${NAMESPACE}
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-socket-ssh
  namespace: ${NAMESPACE}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: browseterm
      ports:
        - protocol: TCP
          port: 22
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-postgres
  namespace: ${NAMESPACE}
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    # Only :5432 into the browseterm namespace -> Postgres (Redis/MinIO listen on other ports).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: browseterm
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-internet-deny-internal
  namespace: ${NAMESPACE}
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    # Allow the internet, but carve out the cluster's own ranges so in-cluster targets
    # (other tenants, Redis, MinIO, arbitrary pods/services) are NOT reachable this way.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - ${POD_CIDR}
              - ${SERVICE_CIDR}
